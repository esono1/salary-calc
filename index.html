<style>
:root {
  --bg: #f4f1ec;
  --surface: #ffffff;
  --surface-2: #f8f6f2;
  --line: #e4dfd6;
  --text: #2b2a27;
  --muted: #7a756c;
  --accent: #2f6f5e;
  --accent-soft: #e2efe9;
  --accent-text: #ffffff;
  --mark-lp: #b4622d;      /* △ 勞點 */
  --mark-lp-soft: #f6e6da;
  --mark-gen: #4a6fa5;     /* ⴸ 一般 */
  --mark-gen-soft: #e3eaf5;
  --mark-sup: #7d5aa6;     /* ○ 支援 */
  --mark-sup-soft: #ece4f5;
  --danger: #b23b3b;
  --danger-soft: #f7e3e3;
  --shadow: 0 1px 2px rgba(40, 35, 25, .06), 0 2px 8px rgba(40, 35, 25, .05);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171a19;
    --surface: #212524;
    --surface-2: #1b1f1e;
    --line: #333937;
    --text: #e9e6e0;
    --muted: #9b968d;
    --accent: #5fb39a;
    --accent-soft: #23362f;
    --accent-text: #0f1a16;
    --mark-lp: #e39a66;
    --mark-lp-soft: #3a2a1f;
    --mark-gen: #86a8de;
    --mark-gen-soft: #222d3d;
    --mark-sup: #b996e0;
    --mark-sup-soft: #2e2539;
    --danger: #e27878;
    --danger-soft: #3a2323;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171a19; --surface: #212524; --surface-2: #1b1f1e; --line: #333937;
  --text: #e9e6e0; --muted: #9b968d; --accent: #5fb39a; --accent-soft: #23362f; --accent-text: #0f1a16;
  --mark-lp: #e39a66; --mark-lp-soft: #3a2a1f; --mark-gen: #86a8de; --mark-gen-soft: #222d3d;
  --mark-sup: #b996e0; --mark-sup-soft: #2e2539; --danger: #e27878; --danger-soft: #3a2323;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* 頂部列 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: middle; background: var(--line); }
.sync-dot.synced { background: var(--accent); }
.sync-dot.busy { background: var(--mark-lp); }
.sync-dot.error { background: var(--danger); }
.topbar-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.brand { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.month-nav { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.month-nav button { border: 0; background: none; width: 34px; height: 34px; border-radius: 999px; cursor: pointer; font-size: 18px; color: var(--muted); }
.month-nav button:hover { background: var(--surface-2); color: var(--text); }
.month-label { font-weight: 600; min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }

main {
  max-width: calc(760px + 32px); margin: 0 auto;
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.view { display: none; }
.view.active { display: block; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 14px;
}
.card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.card h2 .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: auto; }
.muted { color: var(--muted); }

/* 日期列 */
.days {
  display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 4px;
  scroll-snap-type: x proximity; scrollbar-width: thin;
}
.day {
  flex: 0 0 auto; width: 46px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 6px 0 5px; text-align: center; cursor: pointer; scroll-snap-align: center;
  position: relative;
}
.day .wd { font-size: 11px; color: var(--muted); display: block; }
.day .dn { font-size: 16px; font-weight: 600; display: block; font-variant-numeric: tabular-nums; }
.day .ct { font-size: 10.5px; color: var(--muted); display: block; min-height: 15px; font-variant-numeric: tabular-nums; }
.day.has .ct { color: var(--accent); font-weight: 600; }
.day.weekend .wd { color: var(--mark-lp); }
.day.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.day.sel .wd, .day.sel .ct { color: var(--accent-text); opacity: .85; }
.day.today::after { content: ""; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--mark-lp); }

.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.tag { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.tag.k0 { background: var(--mark-lp-soft); color: var(--mark-lp); }
.tag.k1 { background: var(--mark-gen-soft); color: var(--mark-gen); }
.tag.k2 { background: var(--mark-sup-soft); color: var(--mark-sup); }

/* 服務項目輸入 */
.svc { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.svc:first-of-type { border-top: 0; }
.svc-head { display: flex; align-items: baseline; gap: 8px; }
.svc-name { font-weight: 600; }
.svc-meta { font-size: 12px; color: var(--muted); }
.svc-total { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.svc-total b { color: var(--text); }
.steppers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stepper { display: flex; align-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); overflow: hidden; }
.stepper.on.k0 { border-color: var(--mark-lp); background: var(--mark-lp-soft); }
.stepper.on.k1 { border-color: var(--mark-gen); background: var(--mark-gen-soft); }
.stepper.on.k2 { border-color: var(--mark-sup); background: var(--mark-sup-soft); }
.stepper button { border: 0; background: none; width: 34px; height: 38px; font-size: 20px; cursor: pointer; color: var(--muted); flex: 0 0 auto; }
.stepper button:active { background: rgba(127,127,127,.15); }
.stepper .val { flex: 1; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: center; gap: 4px; }
.stepper .val .tag { height: 18px; min-width: 18px; font-size: 11px; }

/* 表單 */
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--muted); }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-height: 40px;
}
.field input:focus, .field select:focus, .ti:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.toggle { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-height: 40px; cursor: pointer; user-select: none; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.full { grid-column: 1 / -1; }

/* 當日摘要 */
.daysum { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--accent); color: var(--accent-text); border-radius: var(--radius); padding: 10px 6px; box-shadow: 0 6px 20px rgba(0,0,0,.15); margin-top: 4px; }
.daysum div { text-align: center; min-width: 0; }
.daysum span { display: block; font-size: 11.5px; opacity: .85; }
.daysum b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 月結 */
.hero { background: var(--accent); color: var(--accent-text); border: 0; }
.hero .lbl { font-size: 13px; opacity: .85; }
.hero .big { font-size: 38px; font-weight: 800; letter-spacing: .5px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.hero .big small { font-size: 16px; font-weight: 600; margin-right: 4px; opacity: .85; }
.hero .eq { font-size: 13px; opacity: .9; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); min-width: 0; }
.stat span { font-size: 12px; color: var(--muted); display: block; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; display: block; }
.stat em { font-style: normal; font-size: 11.5px; color: var(--muted); display: block; }
.stat em.good { color: var(--accent); font-weight: 600; }

.tbl-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
@media (max-width: 360px) { th, td { padding: 7px 3px; } table { font-size: 13px; } }   /* 小螢幕：表格不要超出畫面 */
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tfoot td { font-weight: 700; border-bottom: 0; }
td.zero { color: var(--muted); opacity: .6; }

.rows .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rows .row:last-child { border-bottom: 0; }
.row .k { flex: 1; min-width: 0; }
.row .k small { display: block; color: var(--muted); font-size: 12px; }
.row .v { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .v.neg { color: var(--danger); }
.row.total { font-size: 16px; }
.ti { width: 96px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; }
.ti.wide { width: auto; flex: 1; min-width: 0; text-align: left; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.danger { color: var(--danger); border-color: var(--danger-soft); }
.btn.sm { padding: 4px 10px; min-height: 32px; font-size: 13px; }
.btn.icon { width: 32px; padding: 0; min-height: 32px; color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.svc-edit { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(4, minmax(0, 1fr)) 32px; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.svc-edit.head { font-size: 11.5px; color: var(--muted); border-bottom: 0; padding-bottom: 0; }
.svc-edit input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px; font-variant-numeric: tabular-nums; min-width: 0; }
/* 設定的價目表：勾選顯示、上下移動 */
.svc-item { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.svc-top { display: flex; align-items: center; gap: 6px; }
.svc-item input:not([type="checkbox"]) { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px; font-variant-numeric: tabular-nums; min-width: 0; }
.svc-top .nm { flex: 1; font-weight: 600; }
.svc-item.off .nm, .svc-item.off .svc-nums input { opacity: .5; }
.chk { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: 0 0 auto; cursor: pointer; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.svc-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-left: 34px; }   /* 讓出左邊的拖曳把手 */
.svc-nums.head { font-size: 11.5px; color: var(--muted); }
@media (max-width: 400px) {   /* 小螢幕：第 2 欄（時數係數，像 0.66625）放寬，價錢欄 4 位數也放得下 */
  .svc-nums { gap: 4px; padding-left: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); }
  .svc-nums input { padding: 6px 4px; }
}
.svc-list { position: relative; }
.svc-item { background: var(--surface); }
.grip { width: 28px; height: 36px; margin-left: -2px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--muted);
  border-radius: 10px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.grip:focus-visible { outline: 2px solid var(--accent); }
.svc-item.pressing .grip { background: var(--surface-2); color: var(--text); }
.svc-item.dragging { position: relative; z-index: 5; border-radius: 12px; border-bottom-color: transparent;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .22); cursor: grabbing; }
.svc-item.dragging .grip { color: var(--accent); cursor: grabbing; }
.del { border: 0; background: none; width: 28px; height: 36px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
  color: var(--muted); opacity: .55; cursor: pointer; border-radius: 8px; padding: 0; }
.del:hover, .del:focus-visible { opacity: 1; color: var(--danger); }
.btn:disabled { opacity: .35; cursor: default; }
/* 網頁版掃描工作單的相機畫面 */
.wscan { position: fixed; inset: 0; z-index: 60; background: #000; color: #fff; }
.wscan[hidden] { display: none; }
.wscan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.wscan-frame { position: absolute; left: 7%; right: 7%; top: 16%; bottom: 26%; border: 2px solid rgba(255,255,255,.85); border-radius: 14px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
.wscan-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 16px 12px; }
.wscan-btn { appearance: none; border: 0; border-radius: 999px; padding: 10px 16px; font: inherit; font-size: 15px; font-weight: 600;
  background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
.wscan-btn.on { background: #f5c542; color: #222; }
.wscan-focus { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 2px solid #f5c542; border-radius: 10px; pointer-events: none; }
.wscan-focus[hidden] { display: none; }
.wscan-focus.go { animation: wscan-focus .5s ease-out; }
@keyframes wscan-focus { from { transform: scale(1.5); opacity: .2; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .wscan-focus.go { animation: none; } }
.wscan-hint { position: absolute; left: 16px; right: 16px; bottom: max(20px, env(safe-area-inset-bottom)); padding: 12px 14px; border-radius: 14px;
  background: rgba(0,0,0,.68); font-size: 15px; line-height: 1.55; white-space: pre-line; text-align: center; }
/* 匯出 Excel 的月份勾選 */
.mp-year { border-bottom: 1px solid var(--line); }
.mp-year > summary { display: flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; list-style: none; user-select: none; }
.mp-year > summary::-webkit-details-marker { display: none; }
.mp-year > summary::before { content: "▸"; color: var(--muted); width: 12px; font-size: 12px; }
.mp-year[open] > summary::before { content: "▾"; }
.mp-y { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.mp-n { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mp-n.some { color: var(--accent); font-weight: 600; }
.mp-body { padding: 0 0 10px 20px; }
.mp-list { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.mp { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 50px; height: 34px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; cursor: pointer; user-select: none; font-variant-numeric: tabular-nums; }
.mp input { position: absolute; opacity: 0; pointer-events: none; }
.mp.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.mp:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }

details.more > summary { cursor: pointer; color: var(--muted); font-size: 13.5px; list-style: none; padding: 4px 0; }
details.more > summary::before { content: "▸ "; }
details.more[open] > summary::before { content: "▾ "; }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.empty { text-align: center; color: var(--muted); padding: 18px 0 6px; }

/* 底部導覽 */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabbar button { border: 0; background: none; padding: 8px 0 9px; cursor: pointer; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button.active { color: var(--accent); font-weight: 700; }

.scan-pick select, .scan-pick input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px; min-height: 40px; min-width: 0; }

.slip-time small, .slip-items small { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.slip-items { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.slip-items .it { white-space: nowrap; }   /* 一個項目「足60 ×1」不要從中間斷行 */

/* 手機：輸入框字小於 16px 時，iPhone 點下去會自動放大整個畫面（而且不會縮回來），看起來像跑版 */
@media (pointer: coarse) { input:not([type=checkbox]):not([type=radio]), select, textarea { font-size: 16px !important; } }

<script>
'use strict';

/* ================= 預設資料（依 2026.xlsx 10 月起的版本） ================= */
const STORE_KEY = 'salary-app-v1';
const KINDS = [
  { mark: '△', name: '勞點' },
  { mark: 'ⴸ', name: '一般' },
  { mark: '○', name: '支援' },
];
// 依店家 2026/10/1 起的價目表。price：售價；factor：勞點/時數係數（40 分一律 0.66625）；
// high/low：6抽 / 55抽（表上沒有 55抽 的項目兩者相同）；hidden：預設不顯示在每日登錄
// 調價時改這裡並更新 PRICE_VERSION：使用者的顯示勾選與順序不會被改動
const PRICE_VERSION = '2026-10';
const DEFAULT_SERVICES = [
  { id: 'f60',  name: '足60',     price: 800,  factor: 1,       high: 460,  low: 425 },
  { id: 'f90',  name: '足90',     price: 1300, factor: 1.5,     high: 750,  low: 695 },
  { id: 'fb100',name: '足體100',  price: 1600, factor: 1.66625, high: 900,  low: 835 },
  { id: 'sh30', name: '肩/刮30',  price: 550,  factor: 0.5,     high: 310,  low: 285 },
  { id: 'b60',  name: '體60',     price: 1100, factor: 1,       high: 620,  low: 570 },
  { id: 'b90',  name: '體90',     price: 1600, factor: 1.5,     high: 900,  low: 835 },
  { id: 'b120', name: '體120',    price: 2100, factor: 2,       high: 1185, low: 1090 },
  { id: 'b30',  name: '體30',     price: 600,  factor: 0.5,     high: 340,  low: 310 },
  { id: 'st1',  name: '直購足蒸', price: 650,  factor: 0.66625, high: 325,  low: 300 },
  { id: 'st2',  name: '加購足蒸', price: 500,  factor: 0.66625, high: 235,  low: 215 },
  { id: 'st3',  name: '足蒸+肩',  price: 750,  factor: 0.66625, high: 385,  low: 355 },
  { id: 'f30',  name: '足30',     price: 500,  factor: 0.5,     high: 290,  low: 265,  hidden: true },
  { id: 'tl30', name: '調理30',   price: 800,  factor: 0.5,     high: 450,  low: 415,  hidden: true },
  { id: 'ec40', name: '耳燭40',   price: 850,  factor: 0.66625, high: 480,  low: 445,  hidden: true },
  { id: 'nc30', name: '臍燭30',   price: 1000, factor: 0.5,     high: 565,  low: 520,  hidden: true },
  { id: 'jm90', name: '櫸木90',   price: 1850, factor: 1.5,     high: 1045, low: 965,  hidden: true },
  { id: 'jm30', name: '櫸木30',   price: 700,  factor: 0.5,     high: 395,  low: 365,  hidden: true },
  { id: 'vf70', name: 'V臉70',    price: 1350, factor: 1.16667, high: 700,  low: 700,  hidden: true },
  { id: 'br90', name: '體刷90',   price: 1850, factor: 1.5,     high: 1045, low: 965,  hidden: true },
  { id: 'g560', name: 'G5局部60', price: 1400, factor: 1,       high: 790,  low: 730,  hidden: true },
  { id: 'qy60', name: '輕盈60',   price: 1600, factor: 1,       high: 905,  low: 835,  hidden: true },
  { id: 'nw50', name: '暖宮50',   price: 1600, factor: 0.83333, high: 905,  low: 835,  hidden: true },
];
// 把程式內建的價目表併入使用者的價目表：只更新價格、補上新項目（預設隱藏），
// 不動使用者的顯示勾選、順序、自訂項目，也不會加回使用者刪掉的項目
function syncDefaults() {
  state.dismissed = state.dismissed || [];
  const byId = {};
  state.services.forEach(s => { byId[s.id] = s; });
  const priceUpdate = (state.priceVersion || '') < PRICE_VERSION;
  for (const d of DEFAULT_SERVICES) {
    const cur = byId[d.id];
    if (cur) {
      if (priceUpdate) Object.assign(cur, { price: d.price, factor: d.factor, high: d.high, low: d.low });
    } else if (!state.dismissed.includes(d.id)) {
      state.services.push(Object.assign(clone(d), { hidden: true }));
    }
  }
  state.priceVersion = PRICE_VERSION;
  mergeDupServices();
}
// 舊版掃描在 Excel 匯入的月份（項目 id 是 s0、s1…）另外加了一個同名項目，月明細會分成兩列：
// 把設定裡的 id 那一份併回該月原本的同名項目（張數、工作單紀錄都改過去）
function mergeDupServices() {
  for (const m of Object.values(state.months || {})) {
    const svcs = m.services || [];
    for (let i = svcs.length - 1; i > 0; i--) {
      const dup = svcs[i].id, keep = svcs.slice(0, i).find(s => s.name === svcs[i].name && s.id !== dup);
      if (!keep || !state.services.some(p => p.id === dup)) continue;
      for (const day of Object.values(m.days || {})) {
        const c = day.c && day.c[dup];
        if (c) {
          const t = day.c[keep.id] || (day.c[keep.id] = [0, 0, 0]);
          c.forEach((v, j) => { t[j] = (t[j] || 0) + (v || 0); });
          delete day.c[dup];
        }
        for (const s of Object.values(day.slipLog || {})) for (const x of s.items || []) if (x.id === dup) x.id = keep.id;
      }
      svcs.splice(i, 1);
    }
  }
}
const DEFAULT_RULES = {
  diligence: 2500,      // 勤勞獎金（每月預設）
  nightPay: 200,        // 晚班津貼 / 天
  typhoonPay: 500,      // 颱風加給 / 天
  doterraPay: 50,       // 多特瑞、支援 / 次
  incentive: 1000,      // 激勵獎金
  incentiveSenior: 2000,       // 年資滿 incentiveSeniorMonths 個月後的激勵獎金
  incentiveSeniorMonths: 60,   // 滿 5 年
  lateLimit: 15,        // 當月遲到合計未滿這麼多分鐘才有激勵獎金
  highLaodian: 25,      // 抽成達標：勞點 ≥
  highSeniority: 12,    //           或 年資(月) ≥
  highHours: 150,       //           或 總時數 ≥
  bonus50: 1000,        // 勞點 ≥ 50 額外獎金
  tenureNeed: 25,       // 久任津貼需勞點 ≥
  leaveHalfFrom: 3,     // 當月請假達這麼多天：久任、勤勞發一半（請假 1 天起就沒有激勵獎金）
  leaveZeroFrom: 5,     // 當月請假達這麼多天：久任、勤勞都不發
  leaveDeduct: 1000,    // 休假表標示 -1000 的請假，每天扣款
  tiers: [              // 年資(月) 未滿 under → 勞點乘數 / 久任津貼
    { under: 12, mult: 100, tenure: 0 },
    { under: 24, mult: 125, tenure: 500 },
    { under: 36, mult: 150, tenure: 1000 },
    { under: 48, mult: 175, tenure: 1500 },
    { under: null, mult: 200, tenure: 2000 },
  ],
};

const clone = o => JSON.parse(JSON.stringify(o));
function freshState() {
  return {
    app: 'salary-calc', version: 1,
    profile: { name: '', code: '', hire: '', newSys: '2022-01', leaveLink: '' },
    services: clone(DEFAULT_SERVICES),
    priceVersion: PRICE_VERSION,
    dismissed: [],
    slipMap: {},          // 工作單品項名稱 → 項目（掃描時學會的對應）
    rules: clone(DEFAULT_RULES),
    months: {},
  };
}

/* ================= 儲存 ================= */
let state;
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state = Object.assign(freshState(), s);
      state.rules = Object.assign(clone(DEFAULT_RULES), s.rules || {});
      state.profile = Object.assign(freshState().profile, s.profile || {});
      syncDefaults();
      return;
    }
  } catch (e) { /* 讀取失敗就用預設值 */ }
  state = freshState();
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { if (!cloud) toast('無法儲存到瀏覽器，請記得匯出備份'); }
    markChanges();
    scheduleFlush();
  }, 150);
}

/* ================= 雲端同步（在 claude.ai 開啟時，存到自己帳號的私人空間） ================= */
// 文件：settings（個人資料、價目、規則）＋ 每月一份 m2026-10
const DIRTY_KEY = STORE_KEY + '-dirty';
let cloud = null;          // 自己的私人資料夾
let syncState = 'local';   // local | loading | synced | busy | error
let lastJson = {};         // 每份文件最後一次同步的內容
let dirty = new Set();
let flushing = false, flushTimer = null;

function readDirty() { try { return JSON.parse(localStorage.getItem(DIRTY_KEY)) || []; } catch (e) { return []; } }
function writeDirty() { try { localStorage.setItem(DIRTY_KEY, JSON.stringify([...dirty])); } catch (e) { /* 略過 */ } }
function docsOf(s) {
  const d = { settings: { profile: s.profile, services: s.services, rules: s.rules, priceVersion: s.priceVersion, dismissed: s.dismissed, slipMap: s.slipMap || {} } };
  for (const k in s.months) d['m' + k] = s.months[k];
  return d;
}
function initBaseline() {
  dirty = new Set(readDirty());
  const d = docsOf(state);
  for (const id in d) if (!dirty.has(id)) lastJson[id] = JSON.stringify(d[id]);
}
function markChanges() {
  const d = docsOf(state);
  for (const id in d) if (JSON.stringify(d[id]) !== lastJson[id]) dirty.add(id);
  for (const id in lastJson) if (!(id in d)) dirty.add(id);
  writeDirty();
}
function setSync(s) {
  syncState = s;
  const dot = $('#syncDot');
  if (dot) {
    dot.className = 'sync-dot ' + ({ synced: 'synced', loading: 'busy', busy: 'busy', error: 'error' }[s] || '');
    dot.title = syncText();
  }
  const note = $('#syncNote');
  if (note) note.textContent = syncText();
}
function syncText() {
  return {
    local: '資料只存在這台裝置的瀏覽器裡。換手機、換瀏覽器或清除瀏覽資料前，請先匯出備份檔。',
    loading: '正在讀取雲端資料…',
    synced: '已同步到你的 Claude 帳號，手機和電腦開這個網址看到的是同一份資料，只有你看得到。',
    busy: '正在儲存到雲端…',
    error: '暫時無法連上雲端，資料先存在這台裝置，連線恢復後會自動上傳。',
  }[syncState];
}
function scheduleFlush() {
  if (!cloud) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 800);
}
async function flush() {
  if (!cloud || flushing || !dirty.size) return;
  flushing = true; setSync('busy');
  try {
    while (dirty.size) {
      const id = dirty.values().next().value;
      const body = docsOf(state)[id];
      if (body === undefined) {
        await cloud.doc(id).delete();
        delete lastJson[id];
        dirty.delete(id);
      } else {
        const j = JSON.stringify(body);
        await cloud.doc(id).set(JSON.parse(j));
        lastJson[id] = j;
        if (JSON.stringify(docsOf(state)[id]) === j) dirty.delete(id);
      }
      writeDirty();
    }
    setSync('synced');
  } catch (e) {
    setSync('error');
    if (e && e.code === 'quota_exceeded') toast('雲端空間已滿，請匯出備份');
    clearTimeout(flushTimer); flushTimer = setTimeout(flush, 15000);
  } finally {
    flushing = false;
  }
}
async function initCloud() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id();
  if (!uid) return;
  const col = db.collection('data/users/' + uid);
  setSync('loading');
  let timer;
  try {
    const snap = await Promise.race([
      col.get(),
      new Promise((_, rej) => { timer = setTimeout(() => rej({ code: 'timeout' }), 10000); }),
    ]);
    clearTimeout(timer);
    const cloudIds = new Set();
    for (const doc of snap.docs) {
      cloudIds.add(doc.id);
      if (dirty.has(doc.id)) continue;        // 這台裝置有尚未上傳的修改，以本機為準
      const body = JSON.parse(JSON.stringify(doc.data()));
      lastJson[doc.id] = JSON.stringify(body);
      if (doc.id === 'settings') {
        state.profile = Object.assign(freshState().profile, body.profile || {});
        if (body.services) state.services = body.services;
        state.priceVersion = body.priceVersion || '';
        state.dismissed = body.dismissed || [];
        state.slipMap = body.slipMap || {};
        state.rules = Object.assign(clone(DEFAULT_RULES), body.rules || {});
      } else if (doc.id.startsWith('m')) {
        state.months[doc.id.slice(1)] = body;
      }
    }
    // 本機有、雲端沒有的文件（例如第一次開啟雲端前的資料）一併上傳
    for (const id in docsOf(state)) if (!cloudIds.has(id)) dirty.add(id);
    for (const id in lastJson) if (!cloudIds.has(id)) delete lastJson[id];
    syncDefaults();          // 雲端的價目表也補上新項目／新價格
    markChanges();
    cloud = col;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 略過 */ }
    render();
    setSync('synced');
    flush();
  } catch (e) {
    clearTimeout(timer);
    setSync('error');
    setTimeout(initCloud, 20000);
  }
}

/* ================= 日期工具 ================= */
const now = new Date(Date.now() - 4 * 3600 * 1000);   // 凌晨 4 點前還算前一天（晚班上到 02:00）
let curKey = ymKey(now.getFullYear(), now.getMonth() + 1);
let selDay = now.getDate();
let curTab = 'daily';

function ymKey(y, m) { return `${y}-${String(m).padStart(2, '0')}`; }
function parseYM(k) { const [y, m] = k.split('-').map(Number); return { y, m }; }
function daysIn(k) { const { y, m } = parseYM(k); return new Date(y, m, 0).getDate(); }
function shiftMonth(k, d) { const { y, m } = parseYM(k); const t = new Date(y, m - 1 + d, 1); return ymKey(t.getFullYear(), t.getMonth() + 1); }
function monthsBetween(a, b) { const A = parseYM(a), B = parseYM(b); return (B.y - A.y) * 12 + (B.m - A.m); }
const WD = ['日', '一', '二', '三', '四', '五', '六'];

/* ================= 數字工具 ================= */
const fmt = n => Math.round(n).toLocaleString('zh-TW');
const fix = (n, d = 1) => (Math.round(n * 1e6) / 1e6).toFixed(d).replace(/\.?0+$/, '') || '0';
const r6 = n => Math.round(n * 1e6) / 1e6;                         // 消除浮點誤差
const floorTo = (n, d) => Math.floor(r6(n) * 10 ** d + 1e-7) / 10 ** d; // 等同 Excel ROUNDDOWN
const toNum = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

/* ================= 月份資料 ================= */
function getMonth(k, create) {
  let m = state.months[k];
  if (!m && create) {
    m = state.months[k] = {
      services: clone(state.services),
      days: {},
      diligence: state.rules.diligence,
      extras: [],
      deductions: [],
    };
  }
  return m;
}
function monthServices(k) { const m = state.months[k]; return m ? m.services : state.services; }
// 設定裡的項目 id → 該月價目表裡同一個項目的 id（id 不同時用名稱對，跟 visibleServices 一樣）
function monthSvcId(k, id) {
  const msvcs = monthServices(k);
  if (msvcs.some(s => s.id === id)) return id;
  const pref = state.services.find(s => s.id === id), same = pref && msvcs.find(s => s.name === pref.name);
  return same ? same.id : id;
}
// 依使用者在「設定」的顯示勾選與順序排列某月的項目。
// 價格用該月的價目表；used(id) 為真的項目（已有張數）即使隱藏也照樣顯示
function visibleServices(k, used) {
  const msvcs = monthServices(k);
  const out = [], taken = new Set();
  for (const pref of state.services) {
    const s = msvcs.find(x => x.id === pref.id) || msvcs.find(x => x.name === pref.name);
    if (s && taken.has(s.id)) continue;
    if (s) taken.add(s.id);
    if (!pref.hidden || (s && used(s.id))) out.push(s || pref);   // 本月沒有的項目先用設定裡的價格
  }
  for (const s of msvcs) if (!taken.has(s.id) && used(s.id)) out.push(s);
  return out;
}
// 月份改用新價目表：依項目名稱把已登錄的張數搬到新項目上，回傳對不到的項目名稱
function unmatchedServices(m, services) {
  const names = new Set(services.map(s => s.name));
  return m.services.filter(s => !names.has(s.name)).map(s => s.name);
}
function applyServices(m, services) {
  const byName = {};
  services.forEach(s => { byName[s.name] = s.id; });
  const idMap = {};
  m.services.forEach(s => { if (byName[s.name]) idMap[s.id] = byName[s.name]; });
  for (const d in m.days) {
    const c = m.days[d].c, nc = {};
    for (const id in c) {
      const to = idMap[id] || id;   // 對不到的保留原代號，不列入計算
      const t = nc[to] || (nc[to] = [0, 0, 0]);
      for (let i = 0; i < 3; i++) t[i] += c[id][i];
    }
    m.days[d].c = nc;
  }
  m.services = clone(services);
}
function getDay(k, d, create) {
  const m = getMonth(k, create);
  if (!m) return null;
  let day = m.days[d];
  if (!day && create) day = m.days[d] = { c: {} };
  return day;
}
function cleanupDay(k, d) {
  const m = state.months[k]; if (!m) return;
  const day = m.days[d]; if (!day) return;
  for (const id in day.c) if (!day.c[id].some(Boolean)) delete day.c[id];
  if (day.slipLog && !Object.keys(day.slipLog).length) delete day.slipLog;
  const keys = Object.keys(day).filter(x => x !== 'c' && day[x] !== '' && day[x] !== 0 && day[x] !== false && day[x] != null);
  if (!Object.keys(day.c).length && !keys.length) delete m.days[d];
}

/* ================= 計算（對應 Excel 公式） ================= */
function seniority(k) {
  const { hire, newSys } = state.profile;
  if (!hire) return 0;
  const cur = k;
  if (!newSys || hire > newSys) return Math.max(0, monthsBetween(hire, cur));
  // 新制前的年資折半計算
  return monthsBetween(hire, newSys) / 2 + Math.max(0, monthsBetween(newSys, cur));
}
function tierFor(sen) {
  const tiers = state.rules.tiers;
  for (const t of tiers) if (t.under == null || sen < t.under) return t;
  return tiers[tiers.length - 1];
}
function dayCalc(svcs, day, high) {
  let count = 0, lp = 0, perf = 0, pay = 0;
  if (day) {
    for (const s of svcs) {
      const c = day.c[s.id]; if (!c) continue;
      const n = c[0] + c[1] + c[2];
      count += n;
      lp += c[0] * s.factor;
      perf += n * s.price;
      pay += n * (high ? s.high : s.low);
    }
    if (day.night) pay += state.rules.nightPay;
    if (day.typhoon) pay += state.rules.typhoonPay;
    pay += toNum(day.a12);
    pay += toNum(day.dot) * state.rules.doterraPay;   // 多特瑞含在每日實抽（使用者 2026-11-05；原 Excel 的每日實抽沒有含）
  }
  return { count, net: count - toNum(day && day.ded), lp: r6(lp), perf, pay };
}
function calcMonth(k) {
  const R = state.rules;
  const m = state.months[k];
  const svcs = monthServices(k);
  const days = m ? m.days : {};
  const per = svcs.map(s => ({ s, tri: [0, 0, 0], total: 0 }));
  let lp = 0, hoursRaw = 0, supHours = 0, ded = 0, dot = 0, nightDays = 0, typhoonDays = 0, a12 = 0, late = 0;
  for (const d in days) {
    const day = days[d];
    per.forEach(p => {
      const c = day.c[p.s.id]; if (!c) return;
      for (let i = 0; i < 3; i++) p.tri[i] += c[i];
    });
    ded += toNum(day.ded); dot += toNum(day.dot); a12 += toNum(day.a12); late += toNum(day.late);
    if (day.night) nightDays++;
    if (day.typhoon) typhoonDays++;
  }
  let count = 0, support = 0;
  per.forEach(p => {
    p.total = p.tri[0] + p.tri[1] + p.tri[2];
    count += p.total; support += p.tri[2];
    lp += p.tri[0] * p.s.factor;
    hoursRaw += p.total * p.s.factor;
    supHours += p.tri[2] * p.s.factor;
  });
  lp = r6(lp);
  const hours = floorTo(hoursRaw, 2);
  const sen = seniority(k);
  const tier = tierFor(sen);
  const senior = sen >= R.highSeniority;   // 年資滿一年一定是達標價，畫面不再提示
  const high = lp >= R.highLaodian || senior || hours >= R.highHours;
  per.forEach(p => { p.rate = high ? p.s.high : p.s.low; p.sub = p.total * p.rate; });
  const commission = per.reduce((a, p) => a + p.sub, 0);

  const lpBonus = Math.floor(lp / 10 + 1e-9) * tier.mult + (lp >= 50 ? R.bonus50 : 0);
  // 休假表的請假：1 天起不發激勵；達 leaveHalfFrom 天久任、勤勞減半；達 leaveZeroFrom 天不發
  const lv = m && m.leave;
  const leaveDays = lv ? lv.items.filter(x => x.counted).length : 0;
  const leaveMinusDays = lv ? lv.items.filter(x => x.minus1000).length : 0;
  const leaveDeduct = leaveMinusDays * R.leaveDeduct;
  const leaveFactor = leaveDays >= R.leaveZeroFrom ? 0 : leaveDays >= R.leaveHalfFrom ? 0.5 : 1;
  const tenureBase = lp >= R.tenureNeed ? tier.tenure : 0;
  const tenure = tenureBase * leaveFactor;
  const dotSup = (dot + support) * R.doterraPay;
  const diligenceBase = m && m.diligence != null ? toNum(m.diligence) : R.diligence;
  const diligence = diligenceBase * leaveFactor;
  const night = nightDays * R.nightPay;
  const typhoon = typhoonDays * R.typhoonPay;
  const incAmount = sen >= R.incentiveSeniorMonths ? R.incentiveSenior : R.incentive;
  const autoInc = late < R.lateLimit && leaveDays === 0 ? incAmount : 0;
  const incManual = m && m.incentive != null && m.incentive !== '';
  const incentive = incManual ? toNum(m.incentive) : autoInc;
  const extras = (m ? m.extras : []).reduce((a, x) => a + toNum(x.amount), 0);
  const deductions = (m ? m.deductions : []).reduce((a, x) => a + toNum(x.amount), 0) + leaveDeduct;
  const bonusTotal = lpBonus + tenure + dotSup + diligence + night + typhoon + a12 + incentive + extras;
  const salary = bonusTotal + commission - deductions;

  // 每日實抽、業績
  let perf = 0, paySum = 0, payDays = 0;
  for (const d in days) {
    const dc = dayCalc(svcs, days[d], high);
    perf += dc.perf;
    if (dc.pay) { paySum += dc.pay; payDays++; }
  }
  return {
    per, lp, hours, supHours: r6(supHours), sen, senior, tier, high, commission,
    lpBonus, tenure, dotSup, diligence, night, nightDays, typhoon, typhoonDays, a12, late, autoInc, incManual, incentive,
    extras, deductions, bonusTotal, salary, count, net: count - ded, ded, dot, support,
    leave: lv, leaveDays, leaveMinusDays, leaveDeduct, leaveFactor, tenureBase, diligenceBase,
    perf, avgPay: payDays ? paySum / payDays : 0, workDays: Object.keys(days).length,
  };
}

function ask(msg, yesText = '確定', danger = false) {

    $('#modalMsg').textContent = msg;
    yes.textContent = yesText;
    yes.className = 'btn ' + (danger ? 'danger' : 'primary');

document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t || t.closest('#modal')) return;
  if (t.dataset.tab) { curTab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.day) { selDay = +t.dataset.day; renderDaily(); return; }
  if (t.dataset.step) {
    const day = getDay(curKey, selDay, true);
    const id = t.dataset.svc, i = +t.dataset.k;
    const m = state.months[curKey];
    if (!m.services.some(s => s.id === id)) {        // 建立月份後才勾選顯示的項目，補進本月價目表
      const p = state.services.find(s => s.id === id);
      if (p) m.services.push(clone(p));
    }
    const c = day.c[id] || (day.c[id] = [0, 0, 0]);
    c[i] = Math.max(0, c[i] + +t.dataset.step);
    cleanupDay(curKey, selDay); save(); renderDaily();
    return;
  }
  if (t.dataset.slipdel != null) {
    const day = getDay(curKey, selDay), key = t.dataset.slipdel, log = day && day.slipLog && day.slipLog[key];
    if (log && await ask(`刪除這張工作單（${slipSummary(log, curKey)}）？會一起扣掉它加的張數。`, '刪除', true)) {
      removeSlip(curKey, selDay, key);
      cleanupDay(curKey, selDay); save(); renderDaily(); toast('已刪除');
    }
    return;
  }
  if (t.dataset.slipedit != null) { editSlip(curKey, selDay, t.dataset.slipedit); return; }
  if (t.id === 'nightReset') {
    const day = getDay(curKey, selDay);
    if (day) { delete day.nightAuto; applyNight(curKey, selDay); cleanupDay(curKey, selDay); save(); renderDaily(); }
    return;
  }
  if (t.id === 'clearDay') {
    const m = state.months[curKey];
    if (m && m.days[selDay] && await ask(`清除 ${parseYM(curKey).m}/${selDay} 的所有紀錄？`, '清除', true)) {
      delete m.days[selDay]; save(); renderDaily(); toast('已清除');
    }
    return;
  }
  if (t.id === 'prevMonth' || t.id === 'nextMonth') {
    curKey = shiftMonth(curKey, t.id === 'prevMonth' ? -1 : 1);
    const td = ymKey(now.getFullYear(), now.getMonth() + 1);
    selDay = curKey === td ? now.getDate() : 1;
    render(); return;
  }
  if (t.dataset.act) monthAction(t.dataset.act, t.dataset);
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.dfield) {
    const day = getDay(curKey, selDay, true);
    const f = el.dataset.dfield;
    // 數字欄（張數、分鐘、金額）不會是負的：打錯成負數（例如遲到 -5）會讓合計變少、誤發激勵獎金
    day[f] = el.type === 'checkbox' ? el.checked : (f === 'note' ? el.value.trim() : Math.max(0, toNum(el.value)));
    if ((f === 'night' || f === 'a12') && day.nightAuto) day.nightAuto = false;   // 手動改了就不再自動算
    if (f === 'typhoon') { delete day.nightAuto; applyNight(curKey, selDay); }    // 颱風假：先回到預設（不算），之後仍可手動改
    cleanupDay(curKey, selDay); save(); renderDaily();
  } else if (el.dataset.si != null && scanDraft) {     // 確認畫面改選項目：品名跟著換
    const it = scanDraft.items[+el.dataset.si], t = document.querySelector(`[data-sraw="${el.dataset.si}"]`);
    if (it && t) t.textContent = printedName(it.raw, el.value) || it.raw || '（沒讀到品名）';
  } else if (el.dataset.mfield) {

});

// 休假表卡片：本月的休假（R）、請假與對獎金的影響
function leaveCard(k, c) {
  const lv = c.leave, link = leaveApiUrl(state.profile.leaveLink), app = canFetchLeave();
  if (!app && !lv) return '';                    // 線上版、電腦版讀不到休假表
  const md = d => `${+d.slice(5, 7)}/${+d.slice(8)}`;
  let body;
  if (!link && !lv) body = '<p class="note" style="margin:0">在「設定」貼上休假表的分享連結，就能自動讀取本月的休假與請假。</p>';
  else if (!lv) body = '<p class="note" style="margin:0">還沒讀取本月的休假表。</p>';
  else {
    const effect = !c.leaveDays ? '不影響獎金'
      : '不發激勵獎金' + (c.leaveFactor === 0.5 ? '；久任、勤勞發一半' : c.leaveFactor === 0 ? '；久任、勤勞不發' : '');
    const when = new Date(lv.fetchedAt).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    body = `<div class="rows">
      <div class="row"><div class="k">休假（R）<small>${lv.rDays.map(d => md(d) + (lv.rBack && lv.rBack[d] ? `（銷${esc(lv.rBack[d])}）` : '')).join('、') || '無'}</small></div><div class="v">${lv.rDays.length} 天</div></div>
      ${lv.items.map(x => `<div class="row"><div class="k">${md(x.date)} ${esc(x.kind)}${x.hours ? ` ${esc(x.hours)}` : ''}<small>${x.pending ? '待核准，還沒計入' : x.counted ? '計入請假天數' : '不計入請假天數'}</small></div><div class="v${x.minus1000 ? ' neg' : ''}">${x.minus1000 ? '−' + fmt(state.rules.leaveDeduct) : ''}</div></div>`).join('')}
      <div class="row total"><div class="k">請假天數<small>${effect}</small></div><div class="v">${c.leaveDays} 天</div></div>
    </div>

      : k < curWorkMonth() ? `<br>這個月已經結束，假表會自動更新到 ${+leaveOpenUntil(k).slice(5, 7)}/${LEAVE_FREEZE_DAY} 為止，之後固定。` : ''}</p>`;
  }
  const btn = app && link ? '<div class="btns" style="margin-top:8px"><button class="btn sm" data-act="leave">從休假表更新</button></div>' : '';

// 遲到統計：每天在每日登錄填的遲到分鐘，列出日期、次數、合計，以及對激勵獎金的影響
function lateCard(k, c) {
  const m = state.months[k], R = state.rules, { y, m: mm } = parseYM(k);
  const days = Object.keys((m && m.days) || {}).map(Number).filter(d => toNum(m.days[d].late) > 0).sort((a, b) => a - b);
  const left = R.lateLimit - c.late;
  const effect = c.late < R.lateLimit ? `未達 ${R.lateLimit} 分鐘，激勵獎金照發（還差 ${fix(left, 1)} 分鐘）` : `已達 ${R.lateLimit} 分鐘，不發激勵獎金`;
  const body = days.length ? `<div class="rows">
      ${days.map(d => `<div class="row"><div class="k">${mm}/${d}（${WD[new Date(y, mm - 1, d).getDay()]}）</div><div class="v">${fix(toNum(m.days[d].late), 1)} 分</div></div>`).join('')}
      <div class="row total"><div class="k">合計<small${c.late < R.lateLimit ? '' : ' style="color:var(--danger)"'}>${effect}</small></div><div class="v${c.late < R.lateLimit ? '' : ' neg'}">${fix(c.late, 1)} 分</div></div>
    </div>`
    : `<p class="note" style="margin:0">本月沒有遲到紀錄（在每日登錄填「遲到（分鐘）」）。</p>`;
  return `<div class="card"><h2>遲到統計<span class="hint">${days.length ? `${days.length} 次・合計 ${fix(c.late, 1)} 分鐘` : '0 次'}</span></h2>${body}</div>`;
}
// 打開月結算、或從別的 App 切回來時重讀休假表；同一個月份一分鐘內不重複讀
// （假表系統有流量上限，網站本身也快取 60 秒，再快讀到的也是同一份）
const LEAVE_MIN_GAP = 60 * 1000;
const leaveAutoDone = new Map();   // 月份 → 上次自動讀取的時間
// 已經過去的月份讀過假表就固定下來，不再自動更新（使用者 2026-11-12：過去的月份不用改）；
// 但上個月到這個月 10 號（含）前還會自動更新，月底、月初結算時的修正（補登請假、改免扣）才會帶進來。
// 凌晨 4 點前還算前一天。固定之後真的要更新，在那個月按「從休假表更新」
const LEAVE_FREEZE_DAY = 10;
const workNow = () => new Date(Date.now() - 4 * 3600 * 1000);
const curWorkMonth = () => { const n = workNow(); return ymKey(n.getFullYear(), n.getMonth() + 1); };
const leaveOpenUntil = mk => { const n = shiftMonth(mk, 1); return `${n}-${String(LEAVE_FREEZE_DAY).padStart(2, '0')}`; };   // 這天（含）以後就固定
const leaveFrozen = mk => {
  if (!(state.months[mk] && state.months[mk].leave) || mk >= curWorkMonth()) return false;
  return localDay(workNow()) > leaveOpenUntil(mk);
};
// 休假表每天只自動讀一次（這個月今天已經讀過就不再讀；要馬上更新可以按「從休假表更新」）
function autoLeave(k) {
  if (!canFetchLeave() || !leaveApiUrl(state.profile.leaveLink) || leaveFrozen(k)) return;
  const lv = state.months[k] && state.months[k].leave;
  if (lv && lv.fetchedAt && lv.dayTypes && localDay(new Date(lv.fetchedAt)) === localDay()) return;
  if (Date.now() - (leaveAutoDone.get(k) || 0) < LEAVE_MIN_GAP) return;
  leaveAutoDone.set(k, Date.now());
  refreshLeave(k, true);
}
document.addEventListener('visibilitychange', () => {

  else if (f === 'incentive') { if (el.value === '') delete m.incentive; else m.incentive = toNum(el.value); }
  else {
    const [kind, prop] = f.split('.');
    const item = m[kind][+el.dataset.i];
    item[prop] = prop === 'amount' ? toNum(el.value) : el.value;
  }
  save(); renderMonth();
}
async function monthAction(act, ds) {
  if (act === 'add') {
    const m = getMonth(curKey, true);
    m[ds.kind].push({ label: '', amount: 0 });
    save(); renderMonth();
    const inputs = document.querySelectorAll(`[data-mfield="${ds.kind}.label"]`);
    if (inputs.length) inputs[inputs.length - 1].focus();
  } else if (act === 'del') {
    const m = getMonth(curKey, true);
    m[ds.kind].splice(+ds.i, 1); save(); renderMonth();
  } else if (act === 'resetPrices') {
    const m = getMonth(curKey, true);
    const lost = unmatchedServices(m, state.services);
    const msg = '本月改用「設定」裡目前的價目表？已登錄的張數會依項目名稱保留。'
      + (lost.length ? `\n\n新價目表沒有這些項目，它們的張數將不再計算：${lost.join('、')}` : '');
    if (!await ask(msg, '改用', lost.length > 0)) return;
    applyServices(m, state.services); save(); renderMonth(); toast('已更新本月價目');
  } else if (act === 'addSvc') {
    state.services.push({ id: 'x' + Date.now().toString(36), name: '新項目', price: 0, factor: 1, high: 0, low: 0 });
    save(); renderSettings();
  } else if (act === 'delSvc') {
    const s = state.services[+ds.i];
    if (await ask(`刪除項目「${s.name}」？\n只是不想看到的話，取消勾選就好。已建立的月份不受影響。`, '刪除', true)) {
      if (DEFAULT_SERVICES.some(d => d.id === s.id)) state.dismissed.push(s.id);   // 之後更新也不會再加回來
      state.services.splice(+ds.i, 1); save(); renderSettings();
    }
  } else if (act === 'resetSvc') {
    if (await ask('把價目表恢復成預設值？\n你的勾選、順序和自訂項目都會還原。', '恢復', true)) {
      state.services = clone(DEFAULT_SERVICES); state.dismissed = []; save(); renderSettings(); toast('已恢復預設價目');
    }
  } else if (act === 'resetRules') {
    if (await ask('把計算規則恢復成預設值？', '恢復')) { state.rules = clone(DEFAULT_RULES); save(); renderSettings(); toast('已恢復預設規則'); }
  } else if (act === 'export') {
    exportData();
  } else if (act === 'iosHintOff') {
    try { localStorage.setItem(IOS_HINT_KEY, '1'); } catch (e) { /* 略過 */ }
    renderDaily();
  } else if (act === 'leave') {
    refreshLeave(curKey);
  } else if (act === 'scan') {
    lastScanSrc = ds.src;
    // 即時掃描（網頁版、App 2.0 以上）；更舊的 App 只能拍一張照片辨識
    if (ds.src === 'live') startLiveScan(); else if (appScan()) window.AndroidBridge.scanSlip('camera');
  } else if (act === 'paste') {
    lastScanSrc = 'paste';
    openPasteSheet();
  } else if (act === 'exportXlsx') {
    exportExcel([...(excelPick || [])]);
  } else if (act === 'pickAll' || act === 'pickNone') {
    excelPick = new Set(act === 'pickAll' ? Object.keys(state.months) : []);
    renderSettings();
  } else if (act === 'pickYear' || act === 'unpickYear') {
    for (const k of Object.keys(state.months)) if (k.startsWith(ds.y)) excelPick[act === 'pickYear' ? 'add' : 'delete'](k);
    renderSettings();
  } else if (act === 'import') {
    $('#importFile').click();  } else if (act === 'wipe') {
    if (await ask('刪除所有資料？此動作無法復原，建議先匯出備份。', '下一步', true) && await ask('再次確認：刪除全部月份紀錄與設定？', '全部刪除', true)) {
      state = freshState(); save(); render(); toast('已清除所有資料');
    }
  }
}

/* ================= 價目表排序：長按 ⠿（或項目空白處）後拖曳 ================= */
const LONG_PRESS_MS = 350;
let drag = null;   // { item, list, id, x, y, lastY, timer, active, startPageY, startTop }

document.addEventListener('pointerdown', e => {
  const item = e.target.closest('#svcList .svc-item');
  if (!item || e.button > 0 || drag) return;
  if (e.target.closest('input, button, label')) return;          // 輸入框、勾選、刪除照常使用
  const p = { item, list: item.parentElement, id: e.pointerId, x: e.clientX, y: e.clientY, lastY: e.clientY, active: false };
  p.timer = setTimeout(() => startDrag(p), LONG_PRESS_MS);
  drag = p;
  item.classList.add('pressing');
});
function startDrag(p) {
  if (drag !== p) return;
  p.active = true;
  p.startPageY = p.lastY + window.scrollY;
  p.startTop = p.item.offsetTop;
  p.item.classList.add('dragging');
  try { p.item.setPointerCapture(p.id); } catch (err) { /* 有些瀏覽器不支援 */ }
  if (navigator.vibrate) navigator.vibrate(15);
  requestAnimationFrame(autoScroll);
}
function moveDrag() {
  const { item, list } = drag;
  const yPage = drag.lastY + window.scrollY;
  // 用拖曳中項目的中線判斷位置，越過別人的中線就互換
  const center = drag.startTop + (yPage - drag.startPageY) + item.offsetHeight / 2;
  const before = [...list.children].find(s => s !== item && center < s.offsetTop + s.offsetHeight / 2);
  if (before) { if (item.nextElementSibling !== before) list.insertBefore(item, before); }
  else if (list.lastElementChild !== item) list.appendChild(item);
  item.style.transform = `translateY(${yPage - drag.startPageY - (item.offsetTop - drag.startTop)}px)`;
}
// 拖到畫面上下緣時自動捲動（底部留給導覽列）
function autoScroll() {
  if (!drag || !drag.active) return;
  const y = drag.lastY;
  const dy = y < 90 ? -10 : y > window.innerHeight - 150 ? 10 : 0;
  if (dy) { window.scrollBy(0, dy); moveDrag(); }
  requestAnimationFrame(autoScroll);
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;

  let best = 0, skipped = 0;

    best = Math.max(best * 0.92, score);

/* ================= Excel 匯入（讀取薪資 Excel 的 .xlsx，不需要網路） ================= */
// .xlsx 是 zip 壓縮檔，裡面是 XML；用瀏覽器內建的解壓縮讀取
async function readZip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是 xlsx 檔');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    files[name] = { method, csize, local };
    p += 46 + nameLen + extraLen + commentLen;
  }
  return async name => {
    const f = files[name];
    if (!f) return null;
    const start = f.local + 30 + dv.getUint16(f.local + 26, true) + dv.getUint16(f.local + 28, true);
    const raw = u8.subarray(start, start + f.csize);
    if (f.method === 0) return dec.decode(raw);
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return dec.decode(await new Response(stream).arrayBuffer());
  };
}
const xmlText = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")

// 讀出每個工作表：{ name, cell(row, col) → { v: 值, f: 公式文字 } }
async function parseXlsx(buf) {
  const get = await readZip(buf);
  const shared = [];
  const ss = await get('xl/sharedStrings.xml');
  if (ss) for (const m of ss.matchAll(/<si>([\s\S]*?)<\/si>/g)) {
    const body = m[1].replace(/<rPh[\s\S]*?<\/rPh>/g, '');
    shared.push(xmlText([...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(t => t[1]).join('')));
  }

  }

  for (const m of wb.matchAll(/<sheet\b[^>]*>/g)) {
    const name = xmlText(/name="([^"]*)"/.exec(m[0])[1]);
    const rid = /r:id="([^"]+)"/.exec(m[0]);
    const xml = rid && await get(target[rid[1]]);
    if (!xml) continue;
    const cells = {};
    for (const c of xml.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
      const ref = /r="([A-Z]+)(\d+)"/.exec(c[1]);
      if (!ref) continue;
      const type = (/t="([^"]+)"/.exec(c[1]) || [])[1];
      const inner = c[2] || '';

      let v = vm ? xmlText(vm[1]) : null;
      if (type === 's') v = shared[+v];
      else if (type === 'inlineStr') v = xmlText([...inner.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(t => t[1]).join(''));
      else if (v !== null && type !== 'str' && type !== 'e' && type !== 'b') v = +v;
      cells[ref[1] + ref[2]] = { v, f: fm ? xmlText(fm[1]) : (/<f\b/.test(inner) ? '' : null) };
    }

// Excel 日期序號 → 'YYYY-MM'
function excelYM(serial) {
  if (typeof serial !== 'number') return '';
  const d = new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
  return ymKey(d.getUTCFullYear(), d.getUTCMonth() + 1);
}

// 第 51 列（獎金與扣款）的固定項目；其餘欄位視為「其他加給」
const EXCEL_FIXED_LABELS = new Set(['勞點獎金', '久任津貼', '多特瑞.支援', '勤勞獎金', '晚班津貼', '12後接單', '激勵獎金',

// 範本 10 月版有 11 個項目，順序同預設價目表；匯出的項目依 id 套用同一個項目的格式（顏色），其他項目依位置套
const TPL_BLOCK = { f60: 0, f90: 1, fb100: 2, sh30: 3, b60: 4, b90: 5, b120: 6, b30: 7, st1: 8, st2: 9, st3: 10 };
const TPL_S = 35, TPL_BLOCK_ROWS = new Set([1, 2, ...Array.from({ length: 32 }, (_, i) => i + 3), 35, 36, 37, 48, 49, 50]);
// 匯出的格子 (r, c) 對應到範本的哪一欄：左邊 A 欄照搬；項目區依項目；右邊統計欄依「離 S 欄幾格」；其他列照位置
function tplCol(r, c, S, list) {
  if (c === 1) return 1;
  if (c >= S) return c - S + TPL_S <= 47 ? c - S + TPL_S : 0;
  if (TPL_BLOCK_ROWS.has(r)) {
    const i = Math.floor((c - 2) / 3), b = TPL_BLOCK[list[i] && list[i].id] ?? Math.min(i, 10);
    return 2 + b * 3 + (c - 2) % 3;
  }
  return c < TPL_S ? c : 0;
}
const tplStyle = (r, c) => {
  const row = XLSX_TPL.grid[r - 1];
  if (!row || !c) return 0;

async function saveBinary(filename, u8, mime) {
  if (window.AndroidBridge) {
    if (typeof window.AndroidBridge.saveBase64 !== 'function') { toast('請先安裝新版 App（1.8 以上）才能匯出 Excel'); return; }
    backupPending = true;                  // 匯出 Excel 也算備份過（存好後 onAndroidSaved 記下時間）
    window.AndroidBridge.saveBase64(filename, mime, u8ToBase64(u8));
    return;
  }
  const downloads = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
  if (downloads) {
    try { await downloads.save({ filename, data: new Blob([u8], { type: mime }) }); markBackup(); toast('Excel 已儲存'); }
    catch (e) { if (e && e.code !== 'declined') toast('無法儲存檔案，請稍後再試'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([u8], { type: mime }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  markBackup();
  if (curTab === 'settings') renderSettings();
  toast('Excel 已下載');
}
async function exportExcel(keys) {

function leaveSummary(payload, code, k) {

let leaveBusy = false, leaveDayCache = null;
async function refreshLeave(k, quiet) {
  const url = leaveApiUrl(state.profile.leaveLink);
  if (!url || !canFetchLeave() || leaveBusy) return;   // 一次只讀一份
  if (!state.profile.code) { if (!quiet) toast('請先在「設定」填寫編號'); return; }
  leaveBusy = true;
  try {
    // 同一天讀過的假表留在記憶體裡，換月份不用再讀一次
    if (!leaveDayCache || leaveDayCache.day !== localDay() || !quiet) {
      const text = await fetchLeaveTable(url);
      const j = JSON.parse(text);
      leaveDayCache = { day: localDay(), payload: typeof j.payload === 'string' ? JSON.parse(j.payload) : (j.payload || j), updatedAt: String(j.updatedAt || '') };
    }
    const { payload, updatedAt } = leaveDayCache;
    // 一份假表就有所有期別：這個月和其他已經讀過假表的月份一起更新；
    // 已經過去、讀過假表的月份不動（只有在那個月按「從休假表更新」才更新它）
    // 假表系統會把舊的假期清掉（封存）：假表裡已經沒有這個月的假期，就保留 App 原本存的，不要變成「沒有請假」而改到過去的薪水
    let gone = false;
    for (const mk of new Set([k, ...Object.keys(state.months).filter(x => state.months[x].leave)])) {
      if (leaveFrozen(mk) && (mk !== k || quiet)) continue;
      if (!(payload.periods || []).some(p => String(p.start).slice(0, 7) <= mk && mk <= String(p.end).slice(0, 7))) { if (mk === k) gone = true; continue; }
      let summary;
      try { summary = leaveSummary(payload, state.profile.code, mk); } catch (e) { if (mk === k) throw e; continue; }
      summary.sourceUpdatedAt = updatedAt;                 // 假表最後一次被修改的時間（假表系統記錄的）
      const mo = getMonth(mk, true);
      mo.leave = summary;
      for (const d in mo.days) { applyNight(mk, +d); cleanupDay(mk, +d); }   // 假日可能改了：晚班重新判斷
    }
    save();
    if (curTab === 'month' && curKey === k) renderMonth();
    if (curTab === 'daily' && curKey === k) renderDaily();
    if (!quiet) toast(gone ? (state.months[k] && state.months[k].leave ? '假表裡已經沒有這個月的資料，保留原本存的休假與請假' : '假表裡沒有這個月的假期') : '已更新休假表');
  } catch (e) {
    if (!quiet) toast(e && e.userMsg ? e.userMsg : '休假表讀取失敗');
  } finally {
    leaveBusy = false;
  }
}

async function exportData() {

  }

    try { await downloads.save({ filename, data: text }); markBackup(); toast('備份檔已儲存'); }

  toast(ok ? '檔案已儲存' : '沒有儲存檔案');
};
// 手機 App 在背景下載好新版後呼叫
// 手機 App 在背景下載好新版後呼叫：馬上換成新版（重新載入，資料都在手機裡不受影響）。
// 正在掃描、確認畫面開著、打字中或有詢問視窗時先等，用完再換。
// App 剛安裝時跑的是 APK 裡附的網頁（不是下載的那份），重新載入換不過去，這一次還是要重開 App
let updatePending = false;
const safeToReload = () => $('#sheet').hidden && $('#modal').hidden && !live
  && !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
function tryApplyUpdate() {
  if (!updatePending) return;
  if (!safeToReload()) { setTimeout(tryApplyUpdate, 3000); return; }
  try { sessionStorage.setItem('salary-just-updated', pageVersion()); } catch (e) { /* 沒有也沒關係 */ }
  save();
  location.reload();
}
window.onAndroidUpdate = ver => {
  if (!/\/page\.html$/.test(location.pathname)) { toast('新版本已下載，下次開啟 App 時套用'); return; }
  updatePending = true;
  tryApplyUpdate();
};
function pageVersion() { const m = document.querySelector('meta[name="salary-page-version"]'); return m ? m.content : ''; }
// 網頁版：開著的時候（打開後、回到畫面時，最多 5 分鐘一次）看網站上有沒有新版，有就跟 App 一樣找空檔重新載入。
// 同一個新版本只重新載入一次，萬一拿到的還是舊的也不會一直重整
let webCheckAt = 0;
async function checkWebUpdate() {
  if (window.AndroidBridge || window.claude || !/^(esono1\.github\.io|localhost)$/.test(location.hostname)) return;
  if (Date.now() - webCheckAt < 5 * 60 * 1000) return;
  webCheckAt = Date.now();
  try {
    const t = await (await fetch(location.pathname, { cache: 'no-cache' })).text();
    const v = (/name="salary-page-version" content="([^"]+)"/.exec(t) || [])[1];
    if (!v || !versionLess(pageVersion(), v)) return;
    try { if (sessionStorage.getItem('salary-web-upd') === v) return; sessionStorage.setItem('salary-web-upd', v); } catch (e) { return; }
    updatePending = true; tryApplyUpdate();
  } catch (e) { /* 沒網路就下次再看 */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkWebUpdate(); });

$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const head = new Uint8Array(buf, 0, Math.min(4, buf.byteLength));
    const isZip = head[0] === 0x50 && head[1] === 0x4b;   // .xlsx 以 "PK" 開頭
    await importData(isZip ? await excelToData(buf) : JSON.parse(new TextDecoder().decode(buf)));
  } catch (err) {
    toast(err && err.userMsg ? err.userMsg : '匯入失敗：請選擇薪資計算的備份檔或薪資 Excel（.xlsx）');
  }
});
async function importData(data) {
  {
    if (data.app !== 'salary-calc' || typeof data.months !== 'object') throw new Error('格式不符');
    const incoming = Object.keys(data.months);
    const clash = incoming.filter(k => state.months[k]);
    if (clash.length && !await ask(`以下月份已有資料，匯入會覆蓋：\n${clash.join('、')}`, '覆蓋並匯入', true)) return;
    for (const k of incoming) {
      const m = data.months[k];
      state.months[k] = Object.assign({ days: {}, extras: [], deductions: [], diligence: state.rules.diligence, services: clone(state.services) }, m);
    }
    if (data.profile) {
      for (const key in data.profile) if (data.profile[key] && !state.profile[key]) state.profile[key] = data.profile[key];
    }
    if (data.services) {
      state.services = data.services;
      state.priceVersion = data.priceVersion || '';
      state.dismissed = data.dismissed || [];
      syncDefaults();
    }
    if (data.slipMap) state.slipMap = Object.assign(state.slipMap || {}, data.slipMap);
    if (data.rules) state.rules = Object.assign(clone(DEFAULT_RULES), data.rules);
    save();
    if (incoming.length) { curKey = incoming.sort().at(-1); selDay = 1; }
    render();
    toast(`已匯入 ${incoming.length} 個月份` + (data.skipped && data.skipped.length ? `，略過 ${data.skipped.join('、')}` : ''));
  }
}
/* ================= 啟動 ================= */
load();
initBaseline();
render();
initCloud();
// 網頁版：裝 sw.js 開「跨來源隔離」，辨識才能用多核心。第一次裝好要重新整理一次才生效；
// 瀏覽器不支援（例如部分 Safari）就維持單核心，而且只試一次，不會一直重新整理
if (!window.AndroidBridge && /^(esono1\.github\.io|localhost)$/.test(location.hostname) && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    if (window.crossOriginIsolated) return;
    try { if (sessionStorage.getItem('coi-tried')) return; sessionStorage.setItem('coi-tried', '1'); } catch (e) { return; }
    if (!document.querySelector('#sheet:not([hidden])') && !live) location.reload();
  }).catch(() => { /* 裝不了就單核心 */ });
}
// 網頁版：請瀏覽器把資料標成「保存」，空間不夠或很久沒開時不要自動清掉（瀏覽器不支援就算了）
if (!window.AndroidBridge && !window.claude && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
// 剛自動換成新版：告訴使用者
try {
  const from = sessionStorage.getItem('salary-just-updated');
  if (from) { sessionStorage.removeItem('salary-just-updated'); if (from !== pageVersion()) setTimeout(() => toast('已更新到最新版本 ' + pageVersion()), 600); }
} catch (e) { /* 沒有也沒關係 */ }
// 網頁版：開啟 2 秒後在背景先準備辨識元件（下載過才準備），按「掃描工作單」就能馬上開始讀
if (webScan()) setTimeout(() => { if (!live) SlipOcr.preload(); }, 2000);
setTimeout(checkWebUpdate, 4000);
</script>
</body>
