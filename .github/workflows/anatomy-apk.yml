# 肌肉圖譜 Android App：anatomy/ 有變動時，自動在 GitHub 打包 APK。
# 打包好的 APK 會存成 anatomy/muscle-atlas.apk（直接點開下載），也會出現在該次執行的「Artifacts」區。
name: 肌肉圖譜 APK

on:
  push:
    paths:
      - "anatomy/app/**"
      - "anatomy/android/**"
      - ".github/workflows/anatomy-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

# 同一個分支有新的提交時，取消還在跑的舊打包，避免互相衝突
concurrency:
  group: anatomy-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 打包 APK
        working-directory: anatomy/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../muscle-atlas.apk
          ls -l ../muscle-atlas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: muscle-atlas-apk
          path: anatomy/muscle-atlas.apk
          if-no-files-found: error

      - name: 把 APK 存進 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anatomy/muscle-atlas.apk
          if git diff --cached --quiet; then echo "APK 沒有變動"; exit 0; fi
          git commit -m "Update muscle-atlas.apk"
          # 打包期間分支若有新提交，先接上最新內容再推送（最多試 3 次）
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
